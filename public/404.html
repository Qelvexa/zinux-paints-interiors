<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Zinux Paints &amp; Interior</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        if (path && path !== '/' && path !== '/index.html' && path !== '/404.html') {
          sessionStorage.setItem('spa_redirect', path + search + hash);
        }
        window.location.replace('/' + (search ? search : '') + (hash ? hash : ''));
      })();
    </script>
  </head>
  <body style="background: #0f172a; color: #94a3b8; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Navigating...</p>
  </body>
</html>
